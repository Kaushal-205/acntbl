name: Foundry tests
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.1
      - run: ./script/bootstrap.sh
      - run: python3 -m unittest discover -s monitor
      - run: forge test -vv
